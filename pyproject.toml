[project]
name = "library-catalog"
version = "0.1.0"
description = ""
authors = [
    {name = "Данила",email = "danil.anayev@mail.ru"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "purgatory (>=3.0.1,<4.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "mypy (>=2.2.0,<3.0.0)"
]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "alembic/versions"


[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
extend-exclude = ["alembic/versions"]


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "PLC0415"]


[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402", "F401"]


[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
files = ["src"]
